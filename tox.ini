[tox]
envlist =
    py{311,312,313}-django42
    py{311,312,313,314}-django52


[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
commands =
    coverage run --source django_session_timeout -m pytest {posargs}
    coverage report
deps =
    django42: Django>=4.2,<4.3
    django52: Django>=5.2,<5.3
extras = test

[testenv:format]
basepython = python3.13
deps = ruff
skip_install = true
commands =
    ruff format --check src tests
    ruff check src tests
