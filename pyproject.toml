[project]
name = "django-session-timeout"
version = "0.1.0"
description = "Middleware to expire sessions after specific amount of time"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lab Digital", email = "opensource@labdigital.nl" }]
requires-python = ">=3.11"
dependencies = [
    "Django>=4.2",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/labd/django-session-timeout"
Documentation = "https://django-session-timeout.readthedocs.io/"
Changelog = "https://github.com/labd/django-session-timeout/blob/master/CHANGES"

[dependency-groups]
dev = [
    "coverage[toml]>=7",
    "freezegun>=1.5.5",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-django>=4.11",
    "ruff>=0.17",
    "tox>=4.26",
    "tox-uv>=1.28",
]
docs = [
    "sphinx>=1.8.4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_session_timeout"]

[tool.hatch.build.targets.sdist]
include = [
    "src/django_session_timeout",
    "tests",
    "CHANGES",
    "LICENSE",
    "README.md",
]

[tool.pytest.ini_options]
minversion = "8.0"
strict = true
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["django_session_timeout"]

[tool.coverage.paths]
source = ["src", "*/.tox/*/site-packages"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["django_session_timeout", "tests"]
